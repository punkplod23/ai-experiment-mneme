[package]
name = "mamba3_sov"
version = "0.1.0"
edition = "2021"
default-run = "mamba3_sov"

[lib]
name = "mamba3_sov"
path = "src/lib.rs"

[[bin]]
name = "mamba3_sov"
path = "src/main.rs"

[[bin]]
name = "leibniz_node"
path = "src/bin/leibniz_node.rs"

[dependencies]
candle-core = "0.8.2"
candle-nn = "0.8.2"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
safetensors = "0.4.3"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl"] # For Intel CPUs